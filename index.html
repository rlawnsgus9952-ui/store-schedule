<style>
  :root{
    --bg:#0D1117;
    --surface:#141A22;
    --surface-2:#1B222C;
    --line: rgba(255,255,255,.07);
    --line-strong: rgba(255,255,255,.14);
    --text:#E7EAF0;
    --muted:#7C8695;
    --faint:#454E5C;

    --am:#F5A623;
    --am-ink:#241703;
    --pm:#3E63DD;
    --pm-ink:#EAEEFF;
    --off:#EF5A5A;
    --off-ink:#2A0505;

    --max:#34C0A6;
    --joker:#B57BF2;
    --peanut:#FF8A5C;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent; min-width:0;}
  html,body{
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Pretendard", "Apple SD Gothic Neo", sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y: none;
    overflow-x:hidden;
    width:100%;
  }
  #app{
    max-width:520px; margin:0 auto;
    min-height:100dvh;
    padding: max(18px, env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:14px;
  }

  /* ---------- Header ---------- */
  header{ display:flex; flex-direction:column; gap:4px; }
  .eyebrow{ font-size:12.5px; color:var(--muted); letter-spacing:.02em; }
  h1{
    margin:0; font-size:23px; font-weight:800; letter-spacing:-.01em;
    display:flex; align-items:baseline; gap:8px;
  }
  h1 .pulse{
    width:7px; height:7px; border-radius:50%; background:var(--am);
    display:inline-block; box-shadow:0 0 0 3px rgba(245,166,35,.18);
    transform: translateY(-3px);
  }

  /* ---------- Tabs ---------- */
  .tabs{
    display:flex; background:var(--surface); border:1px solid var(--line);
    border-radius:12px; padding:3px; gap:3px; margin-top:6px;
  }
  .tab{
    flex:1; border:0; background:transparent; color:var(--muted);
    font-size:14px; font-weight:700; padding:9px 0; border-radius:9px;
    font-family:inherit; cursor:pointer; transition:background .15s, color .15s;
  }
  .tab.active{ background:var(--surface-2); color:var(--text); }

  .person-picker{
    display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px;
  }
  .person-picker.hidden{ display:none; }
  .person-picker button{
    font-family:inherit; border-radius:12px; padding:10px 6px;
    border:1.5px solid var(--line); background:var(--surface);
    color:var(--text); cursor:pointer; text-align:center;
    display:flex; flex-direction:column; gap:2px; align-items:center;
  }
  .person-picker button .en{ font-size:13.5px; font-weight:800; letter-spacing:.01em; }
  .person-picker button .kr{ font-size:11px; color:var(--muted); }
  .person-picker button[data-active="true"]{ background:var(--surface-2); }
  .person-picker button[data-person="max"][data-active="true"]{ border-color:var(--max); }
  .person-picker button[data-person="joker"][data-active="true"]{ border-color:var(--joker); }
  .person-picker button[data-person="peanut"][data-active="true"]{ border-color:var(--peanut); }
  .person-picker button[data-person="max"] .en{ color:var(--max); }
  .person-picker button[data-person="joker"] .en{ color:var(--joker); }
  .person-picker button[data-person="peanut"] .en{ color:var(--peanut); }

  /* ---------- Month nav ---------- */
  .month-nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:2px 2px;
  }
  .month-nav button{
    width:36px; height:36px; border-radius:10px; border:1px solid var(--line);
    background:var(--surface); color:var(--text); font-size:17px;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .month-nav button:disabled{ opacity:.3; }
  #monthLabel{
    font-size:16.5px; font-weight:800; font-variant-numeric:tabular-nums;
  }

  /* ---------- Legend ---------- */
  .legend{ display:flex; gap:14px; font-size:11.5px; color:var(--muted); padding:0 2px; }
  .legend span{ display:flex; align-items:center; gap:5px; }
  .dot{ width:9px; height:9px; border-radius:3px; display:inline-block; }
  .dot.am{ background:var(--am); }
  .dot.pm{ background:var(--pm); }
  .dot.off{ background:var(--off); }

  /* ---------- Calendar ---------- */
  .weekdays{
    display:grid; grid-template-columns:repeat(7,1fr);
    font-size:11.5px; color:var(--muted); text-align:center; padding:0 1px;
  }
  .weekdays span:first-child{ color:#E76A6A; }
  .weekdays span:last-child{ color:#5B8CFF; }

  .calendar{
    display:grid; grid-template-columns:repeat(7, minmax(0,1fr));
    gap:5px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:8px;
    width:100%;
    overflow:hidden;
  }

  .day{
    aspect-ratio: 1 / 1.18;
    border-radius:10px;
    background:var(--surface-2);
    position:relative;
    padding:5px 4px 4px;
    display:flex; flex-direction:column; gap:3px;
    border:1px solid transparent;
  }
  .day.pad{ background:transparent; }
  .day.pad .date-num{ color:var(--faint); }
  .day.empty .date-num{ color:var(--faint); }
  .day.today{ border-color: var(--am); }

  .date-num{
    font-size:11.5px; font-weight:700; color:var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .day.pad .rows, .day.empty .rows{ display:none; }

  .rows{ display:flex; flex-direction:column; gap:2px; flex:1; justify-content:flex-end; min-width:0; }
  .prow{
    display:flex; align-items:center; gap:3px;
    border-radius:4px; padding:1px 3px;
    font-size:8.6px; font-weight:800; line-height:1.5;
    font-variant-numeric: tabular-nums;
    overflow:hidden; white-space:nowrap; min-width:0;
  }
  .prow .init{ opacity:.85; }
  .prow.am{ background:color-mix(in srgb, var(--am) 24%, transparent); color:var(--am); }
  .prow.pm{ background:color-mix(in srgb, var(--pm) 26%, transparent); color:#9DB2FF; }
  .prow.off{ background:color-mix(in srgb, var(--off) 22%, transparent); color:#FF9C9C; }

  /* ---------- Mine view ---------- */
  .day.mine-am{ background:var(--am); border-color:var(--am); }
  .day.mine-pm{ background:var(--pm); border-color:var(--pm); }
  .day.mine-off{ background:var(--off); border-color:var(--off); }
  .day.mine-am .date-num{ color:var(--am-ink); }
  .day.mine-pm .date-num{ color:var(--pm-ink); }
  .day.mine-off .date-num{ color:#FFE1E1; }
  .mine-label{
    font-size:9.5px; font-weight:800; margin-top:auto;
    line-height:1.15;
  }
  .day.mine-am .mine-label{ color:var(--am-ink); }
  .day.mine-pm .mine-label{ color:var(--pm-ink); }
  .day.mine-off .mine-label{ color:#FFE1E1; }

  /* ---------- Footer / install tip ---------- */
  .note{
    font-size:12px; color:var(--muted); text-align:center; padding:2px 8px;
  }
  details.install-tip{
    background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:12px 14px; margin-top:2px;
  }
  details.install-tip summary{
    cursor:pointer; font-size:13.5px; font-weight:700; color:var(--text);
    list-style:none; display:flex; align-items:center; gap:6px;
  }
  details.install-tip summary::-webkit-details-marker{ display:none; }
  details.install-tip summary::before{ content:"＋"; color:var(--am); font-weight:800; }
  details.install-tip[open] summary::before{ content:"－"; }
  .install-tip ol{ margin:10px 0 2px; padding-left:18px; font-size:12.5px; color:var(--muted); line-height:1.7; }
  .install-tip b{ color:var(--text); }

  @media (max-width:340px){
    .prow{ font-size:8px; }
  }
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="eyebrow">24시간 매장 · 3인 교대 근무표</div>
    <h1><span class="pulse"></span>근무표</h1>
    <div class="tabs">
      <button class="tab active" data-view="all">전체 일정</button>
      <button class="tab" data-view="mine">내 일정</button>
    </div>
    <div id="personPicker" class="person-picker hidden">
      <button data-person="max"><span class="en">MAX</span></button>
      <button data-person="joker"><span class="en">Joker</span></button>
      <button data-person="peanut"><span class="en">Peanut</span></button>
    </div>
  </header>

  <div class="month-nav">
    <button id="prevMonth" aria-label="이전 달">‹</button>
    <div id="monthLabel">2026년 9월</div>
    <button id="nextMonth" aria-label="다음 달">›</button>
  </div>

  <div class="legend">
    <span><i class="dot am"></i>0~12시</span>
    <span><i class="dot pm"></i>12~24시</span>
    <span><i class="dot off"></i>휴무</span>
  </div>

  <div class="weekdays">
    <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
  </div>

  <div id="calendarGrid" class="calendar"></div>

  <p class="note">9월 20일부터 4근무·2휴무 패턴이 계속 반복돼요<br>매월 1~5일은 전 근무자 출근일이라 공백으로 표시돼요</p>

  <details class="install-tip">
    <summary>아이폰 홈 화면에 추가하기</summary>
    <ol>
      <li>이 페이지를 <b>Safari</b>로 열어주세요 (다른 브라우저는 지원 안 함)</li>
      <li>하단 <b>공유 버튼</b>(사각형에서 위로 화살표) 탭</li>
      <li><b>"홈 화면에 추가"</b> 선택 후 <b>추가</b> 탭</li>
      <li>홈 화면 아이콘을 누르면 바로 이 근무표가 열려요</li>
    </ol>
  </details>

</div>

<script>
(function(){
  "use strict";

  // ---------- 근무 데이터 ----------
  // 9/20 ~ 10/10 : 이미지 원본 그대로 하드코딩 (10/1은 근무 조정으로 3명 모두 휴무)
  var HARD = {
    "2026-09-20":{peanut:"pm",max:"am",joker:"off"},
    "2026-09-21":{peanut:"pm",max:"am",joker:"off"},
    "2026-09-22":{peanut:"off",max:"am",joker:"pm"},
    "2026-09-23":{peanut:"off",max:"am",joker:"pm"},
    "2026-09-24":{peanut:"am",max:"off",joker:"pm"},
    "2026-09-25":{peanut:"am",max:"off",joker:"pm"},
    "2026-09-26":{peanut:"am",max:"pm",joker:"off"},
    "2026-09-27":{peanut:"am",max:"pm",joker:"off"},
    "2026-09-28":{peanut:"off",max:"pm",joker:"am"},
    "2026-09-29":{peanut:"off",max:"pm",joker:"am"},
    "2026-09-30":{peanut:"pm",max:"off",joker:"am"},
    "2026-10-01":{peanut:"off",max:"off",joker:"off"},
    "2026-10-02":{peanut:"pm",max:"pm",joker:"am"},
    "2026-10-03":{peanut:"pm",max:"pm",joker:"am"},
    "2026-10-04":{peanut:"pm",max:"pm",joker:"am"},
    "2026-10-05":{peanut:"pm",max:"pm",joker:"am"},
    "2026-10-06":{peanut:"pm",max:"off",joker:"off"},
    "2026-10-07":{peanut:"pm",max:"am",joker:"off"},
    "2026-10-08":{peanut:"pm",max:"am",joker:"off"},
    "2026-10-09":{peanut:"off",max:"am",joker:"pm"},
    "2026-10-10":{peanut:"off",max:"am",joker:"pm"}
  };

  // 10/11부터 확정된 "4근무-2휴무-4근무(반대타임)-2휴무" 12일 주기를 계속 반복
  var ANCHOR = new Date(2026,9,11); // 2026-10-11
  var CYCLE = {
    peanut: ["am","am","am","am","off","off","pm","pm","pm","pm","off","off"],
    max:    ["off","off","pm","pm","pm","pm","off","off","am","am","am","am"],
    joker:  ["pm","pm","off","off","am","am","am","am","off","off","pm","pm"]
  };
  var START_DATE = new Date(2026,8,20); // 2026-09-20
  var MIN_MONTH = new Date(2026,8,1);   // 2026-09 이전으로는 못 감

  function pad2(n){ return n<10 ? "0"+n : ""+n; }
  function fmt(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
  function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
  function diffDays(a,b){ return Math.round((b-a)/86400000); }

  function getStatus(date, person){
    // 매월 1~5일은 전 근무자 출근(공백 처리) — 6일부터 원래 흐름 그대로 이어짐
    if(date.getDate() <= 5) return null;

    var key = fmt(date);
    if(HARD[key]) return HARD[key][person];
    if(date < START_DATE) return null;
    if(date >= ANCHOR){
      var idx = ((diffDays(ANCHOR,date) % 12) + 12) % 12;
      return CYCLE[person][idx];
    }
    return null;
  }

  var PEOPLE = [
    {key:"max", initial:"M", en:"MAX"},
    {key:"joker", initial:"J", en:"Joker"},
    {key:"peanut", initial:"P", en:"Peanut"}
  ];

  var LABEL = {am:"0~12시", pm:"12~24시", off:"휴무"};

  // ---------- 상태 ----------
  var view = "all";
  var minePerson = "max";
  var cursor = new Date(2026,8,1); // 표시중인 달 (2026-09)
  var today = new Date();

  // ---------- 렌더 ----------
  var grid = document.getElementById("calendarGrid");
  var monthLabel = document.getElementById("monthLabel");
  var prevBtn = document.getElementById("prevMonth");
  var nextBtn = document.getElementById("nextMonth");
  var personPicker = document.getElementById("personPicker");

  function renderMonthLabel(){
    monthLabel.textContent = cursor.getFullYear()+"년 "+(cursor.getMonth()+1)+"월";
    prevBtn.disabled = (cursor.getFullYear()===MIN_MONTH.getFullYear() && cursor.getMonth()===MIN_MONTH.getMonth());
  }

  function renderCalendar(){
    grid.innerHTML = "";
    var y = cursor.getFullYear(), m = cursor.getMonth();
    var firstDow = new Date(y,m,1).getDay();
    var daysInMonth = new Date(y,m+1,0).getDate();
    var totalCells = Math.ceil((firstDow + daysInMonth) / 7) * 7;

    for(var i=0;i<totalCells;i++){
      var dayNum = i - firstDow + 1;
      var cell = document.createElement("div");
      cell.className = "day";

      if(dayNum < 1 || dayNum > daysInMonth){
        cell.classList.add("pad");
        grid.appendChild(cell);
        continue;
      }

      var date = new Date(y,m,dayNum);
      if(sameDay(date, today)) cell.classList.add("today");

      var dateNum = document.createElement("div");
      dateNum.className = "date-num";
      dateNum.textContent = dayNum;
      cell.appendChild(dateNum);

      if(view === "all"){
        var hasAny = false;
        var rows = document.createElement("div");
        rows.className = "rows";
        PEOPLE.forEach(function(p){
          var st = getStatus(date, p.key);
          if(!st) return;
          hasAny = true;
          var row = document.createElement("div");
          row.className = "prow " + st;
          row.innerHTML = '<span class="init">'+p.initial+'</span>';
          rows.appendChild(row);
        });
        if(!hasAny) cell.classList.add("empty");
        cell.appendChild(rows);
      } else {
        var st2 = getStatus(date, minePerson);
        if(st2){
          cell.classList.add("mine-"+st2);
          var lab = document.createElement("div");
          lab.className = "mine-label";
          lab.textContent = LABEL[st2];
          cell.appendChild(lab);
        } else {
          cell.classList.add("empty");
        }
      }

      grid.appendChild(cell);
    }
  }

  function render(){
    renderMonthLabel();
    renderCalendar();
  }

  // ---------- 이벤트 ----------
  document.querySelectorAll(".tab").forEach(function(btn){
    btn.addEventListener("click", function(){
      document.querySelectorAll(".tab").forEach(function(b){ b.classList.remove("active"); });
      btn.classList.add("active");
      view = btn.getAttribute("data-view");
      personPicker.classList.toggle("hidden", view !== "mine");
      render();
    });
  });

  personPicker.querySelectorAll("button").forEach(function(btn){
    btn.addEventListener("click", function(){
      minePerson = btn.getAttribute("data-person");
      personPicker.querySelectorAll("button").forEach(function(b){ b.removeAttribute("data-active"); });
      btn.setAttribute("data-active","true");
      render();
    });
  });
  personPicker.querySelector('[data-person="max"]').setAttribute("data-active","true");

  prevBtn.addEventListener("click", function(){
    if(prevBtn.disabled) return;
    cursor = new Date(cursor.getFullYear(), cursor.getMonth()-1, 1);
    render();
  });
  nextBtn.addEventListener("click", function(){
    cursor = new Date(cursor.getFullYear(), cursor.getMonth()+1, 1);
    render();
  });

  render();
})();
</script>
</body>
</html>
